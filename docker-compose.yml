version: "3.9"

services:
  server:
    build: ./server
    container_name: soviecnhom-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/uploads
    restart: unless-stopped

  client:
    build: ./client
    container_name: soviecnhom-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
